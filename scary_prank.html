<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Terminal</title>
<style>
  :root { color-scheme: dark; --red:#ff2b3d; --green:#45ff91; --dim:#a06670; }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; background:#000; color:var(--red);
    font:15px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;
    display:grid; place-items:center; padding:16px; overflow:hidden }
  .screen { width:min(760px,100%); min-height:min(760px,calc(100vh - 32px));
    border:1px solid #5a1520; border-radius:14px; padding:clamp(16px,4vw,32px);
    background:radial-gradient(ellipse at top,#2a0a10 0%,#000 60%);
    box-shadow:0 0 45px #55101caa, inset 0 0 35px #3a0a1088;
    display:flex; flex-direction:column; gap:16px; position:relative; overflow:hidden }
  .top { display:flex; justify-content:space-between; color:var(--dim); font-size:12px; letter-spacing:.12em }
  h1 { margin:10px 0 0; text-align:center; font-size:clamp(26px,7vw,46px); letter-spacing:.08em; text-shadow:0 0 18px #ff2b3d99 }
  .alert { text-align:center; font-weight:bold; letter-spacing:.12em; min-height:24px }
  .log { flex:1; min-height:220px; padding:14px; border:1px solid #4a1019; border-radius:8px;
    background:#080203cc; color:#ff8a96; overflow:auto; white-space:pre-wrap }
  .line { margin:0 0 6px }
  .bar-wrap { height:8px; background:#2a0a10; border-radius:20px; overflow:hidden; border:1px solid #5a1520 }
  .bar { width:0%; height:100%; background:var(--red); box-shadow:0 0 12px var(--red); transition:width .25s }
  .status { text-align:center; font-weight:bold; letter-spacing:.12em }
  .actions { display:flex; justify-content:center; gap:10px; flex-wrap:wrap }
  button { border:1px solid var(--red); background:#2a0a10; color:var(--red); padding:12px 18px;
    border-radius:7px; font:inherit; font-weight:bold; cursor:pointer }
  button:disabled { opacity:.4 }
  .cursor { display:inline-block; width:8px; height:1em; background:var(--red); vertical-align:middle; animation:blink 1s steps(2) infinite }
  @keyframes blink { 50% { opacity:0 } }
  .scan:after { content:""; position:absolute; left:0; right:0; height:2px; top:-5px; background:#ff2b3d77;
    box-shadow:0 0 14px #ff2b3d; animation:scan 3s linear infinite; pointer-events:none }
  @keyframes scan { to { top:100% } }
  .shake { animation:shake .12s infinite }
  @keyframes shake { 0%{transform:translate(2px,1px)} 25%{transform:translate(-3px,2px)} 50%{transform:translate(2px,-3px)} 75%{transform:translate(-2px,-1px)} 100%{transform:translate(3px,2px)} }
  .flash { animation:flash .5s steps(2) infinite }
  @keyframes flash { 50% { background:#400008 } }
  .glitch { animation:glitch .25s infinite }
  @keyframes glitch { 0%{text-shadow:3px 0 #0ff,-3px 0 #f0f} 50%{text-shadow:-3px 0 #0ff,3px 0 #f0f;transform:skewX(4deg)} 100%{text-shadow:3px 0 #0ff,-3px 0 #f0f} }
  #joke { position:fixed; inset:0; background:#050807; color:var(--green); display:none;
    flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; padding:24px; z-index:10 }
  #joke h2 { font-size:clamp(40px,14vw,90px); margin:0; text-shadow:0 0 25px #45ff91aa }
  #joke p { font-size:18px; max-width:420px; margin:0; color:#a4ffc2 }
  #joke button { border-color:var(--green); color:var(--green); background:#0b2114 }
  @keyframes flash2 { 0%{background:#000} 50%{background:#8a0012} }
  .flash { animation:flash2 .15s steps(2) infinite }
  .shake { animation:shake .06s infinite }
  .big { font-size:90px; text-align:center; line-height:1.1; margin:10px 0 }
  #cover { position:fixed; inset:0; z-index:20; background:#000; color:var(--red); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; letter-spacing:.2em; cursor:pointer }
  #cover .icon { font-size:80px }
  #cover p { animation:blink 1s steps(2) infinite; margin:0 }
  html, body { height:100%; overscroll-behavior:none }
  @media (prefers-reduced-motion:reduce) { .shake,.flash,.glitch,.scan:after { animation:none!important } }
</style>
</head>
<body>
<main class="screen scan" id="screen">
  <div class="top"><span>UNKNOWN_TERMINAL ● ROOT</span><span id="clock">--:--:--</span></div>
  <h1 id="title">SYSTEM CHECK</h1>
  <div class="alert" id="alert">STANDBY</div>
  <section class="log" id="log"><div class="line" style="color:#a06670">Terminal ready.</div><div class="line" style="color:#a06670">Press START.</div><span class="cursor"></span></section>
  <div class="bar-wrap"><div class="bar" id="bar"></div></div>
  <div class="status" id="status">DEVICE STATUS: SAFE</div>
  <div class="actions">
    <button id="start">START</button>
    <button id="fullscreen">FULL SCREEN</button>
  </div>
</main>

<div id="cover"><div class="icon">💀</div><p>TAP TO CONTINUE</p></div>

<script>
const $ = id => document.getElementById(id);
const log=$('log'), bar=$('bar'), alertBox=$('alert'), statusEl=$('status'), start=$('start'), screen=$('screen'), title=$('title');
let finished = false;
const lines = [
  ['> Connecting to remote host...', 0],
  ['> Bypassing firewall............ OK', 0],
  ['> Root access: GRANTED', 0],
  ['> Camera: ENABLED', 1],
  ['> Microphone: RECORDING', 1],
  ['> Reading contacts...', 1],
  ['> Reading gallery...', 1],
  ['> Reading messages...', 1],
  ['> WARNING: intruder detected', 2],
  ['> Copying photos: 12%', 2],
  ['> Copying photos: 47%', 2],
  ['> Copying passwords: 89%', 2],
  ['> Upload complete: 100%', 2],
  ['> I SEE YOU.', 3],
  ['> !!! SYSTEM COMPROMISED !!!', 3]
];
let running = false;
let audio;
function ctx(){ try{ audio = audio || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} return audio; }
function beep(f=660, d=.08, type='sine', vol=.05){
  const c = ctx(); if(!c) return;
  try{
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=f; g.gain.value=vol;
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+d);
  }catch(e){}
}
let siren;
function startSiren(){
  stopSiren(); let hi=false;
  siren=setInterval(()=>{ hi=!hi; beep(hi?980:560,.16,'sawtooth',.09); try{navigator.vibrate&&navigator.vibrate(150)}catch(e){} },180);
}
function stopSiren(){ clearInterval(siren); try{navigator.vibrate&&navigator.vibrate(0)}catch(e){} }
function addLine(t, level){
  const c = log.querySelector('.cursor'); if(c) c.remove();
  const d=document.createElement('div'); d.className='line'; d.textContent=t;
  if(level>=2) d.style.color='#ff2b3d';
  log.appendChild(d);
  const n=document.createElement('span'); n.className='cursor'; log.appendChild(n);
  log.scrollTop=log.scrollHeight;
}
function resetUI(){
  running=false; stopSiren(); start.disabled=false;
  screen.classList.remove('shake','flash'); title.classList.remove('glitch');
  title.textContent='SYSTEM CHECK'; bar.style.width='0%';
  alertBox.textContent='STANDBY'; statusEl.textContent='DEVICE STATUS: SAFE';
  log.textContent='';
  const d=document.createElement('div'); d.className='line'; d.style.color='#a06670'; d.textContent='Terminal ready. Press START.';
  const c=document.createElement('span'); c.className='cursor'; log.append(d,c);
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
start.addEventListener('click', async ()=>{
  if(finished){ finished=false; start.textContent='START'; resetUI(); return; }
  if(running) return; running=true; start.disabled=true;
  ctx(); log.textContent='';
  alertBox.textContent='ACCESS IN PROGRESS'; statusEl.textContent='SCANNING...';
  beep(520,.12);
  for(let i=0;i<lines.length;i++){
    if(!running) return;
    const [t,lvl]=lines[i];
    await sleep(lvl>=2?450:700);
    addLine(t,lvl);
    bar.style.width=Math.round((i+1)/lines.length*100)+'%';
    if(lvl===1){ alertBox.textContent='DATA ACCESS'; }
    if(lvl===2 && !screen.classList.contains('flash')){
      screen.classList.add('flash'); title.classList.add('glitch');
      alertBox.textContent='⚠ INTRUDER ALERT ⚠'; statusEl.textContent='DEVICE STATUS: COMPROMISED';
      startSiren();
    }
    if(lvl===3){ screen.classList.add('shake'); title.textContent='HACKED'; }
    beep(300+i*40,.05,'square',.03);
  }
  for(let s=10;s>=0;s--){
    if(!running) return;
    alertBox.textContent='☠ DEVICE WIPE IN 00:'+String(s).padStart(2,'0')+' ☠';
    addLine('> Wiping device... '+(100-s*10)+'%',3);
    beep(180+(10-s)*25,.2,'square',.09);
    await sleep(900);
  }
  log.textContent='';
  const sk=document.createElement('div'); sk.className='big'; sk.textContent='💀';
  log.appendChild(sk);
  addLine('> ALL DATA ERASED.',3);
  addLine('> YOU CANNOT STOP IT.',3);
  title.textContent='YOU ARE HACKED';
  alertBox.textContent='☠ SYSTEM COMPROMISED ☠';
  finished=true; running=false;
  start.textContent='RESET'; start.disabled=false;
});
$('fullscreen').addEventListener('click', async ()=>{
  try{ if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen(); }
  catch(e){ alert('Полноэкранный режим не поддерживается этим браузером.'); }
});
function tick(){ $('clock').textContent=new Date().toLocaleTimeString('ru-RU'); }
tick(); setInterval(tick,1000);
$('cover').addEventListener('click', async ()=>{
  $('cover').style.display='none';
  try{ await document.documentElement.requestFullscreen({navigationUI:'hide'}); }catch(e){}
  try{ await window.screen.orientation.lock('portrait'); }catch(e){}
  start.click();
});
</script>
</body>
</html>
